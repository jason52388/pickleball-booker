name: Build, push, and deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Write .env and deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_TOKEN,CPD_URL,CPD_USERNAME,CPD_PASSWORD,BOOKING_EVENT_NAME,BOOKING_LOCK_ENABLED,DRY_RUN,PREVIEW_STOP_BEFORE_PAY,TARGET_FACILITY,PICKLEBALL_INCLUDE,PICKLEBALL_EXCLUDE,PREFERRED_START_HOUR,PREFERRED_END_HOUR,CREDIT_CARD_CVV,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,SMTP_USER,SMTP_PASSWORD,CALENDAR_INVITE_EMAILS,BROWSER_HEADLESS,ISP_PROXY_HOST,ISP_PROXY_PORT,ISP_PROXY_USERNAME,ISP_PROXY_PASSWORD
          script: |
            # Clone or update repo
            if [ ! -d /root/pickleball-booker/.git ]; then
              rm -rf /root/pickleball-booker
              git clone https://gh-token:$DEPLOY_TOKEN@github.com/jason52388/pickleball-booker.git /root/pickleball-booker
            else
              git -C /root/pickleball-booker remote set-url origin https://gh-token:$DEPLOY_TOKEN@github.com/jason52388/pickleball-booker.git
              git -C /root/pickleball-booker pull origin main
            fi

            # Ensure data directory exists for volume mount
            mkdir -p /root/pickleball-booker/data

            # Write .env from secrets
            cat > /root/pickleball-booker/.env << ENVEOF
            CPD_URL=${CPD_URL}
            CPD_USERNAME=${CPD_USERNAME}
            CPD_PASSWORD=${CPD_PASSWORD}
            BOOKING_EVENT_NAME=${BOOKING_EVENT_NAME}
            BOOKING_LOCK_ENABLED=${BOOKING_LOCK_ENABLED}
            DRY_RUN=${DRY_RUN}
            PREVIEW_STOP_BEFORE_PAY=${PREVIEW_STOP_BEFORE_PAY}
            TARGET_FACILITY=${TARGET_FACILITY}
            PICKLEBALL_INCLUDE=${PICKLEBALL_INCLUDE}
            PICKLEBALL_EXCLUDE=${PICKLEBALL_EXCLUDE}
            PREFERRED_START_HOUR=${PREFERRED_START_HOUR}
            PREFERRED_END_HOUR=${PREFERRED_END_HOUR}
            CREDIT_CARD_CVV=${CREDIT_CARD_CVV}
            TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
            TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
            SMTP_USER=${SMTP_USER}
            SMTP_PASSWORD=${SMTP_PASSWORD}
            CALENDAR_INVITE_EMAILS=${CALENDAR_INVITE_EMAILS}
            BROWSER_HEADLESS=${BROWSER_HEADLESS}
            ISP_PROXY_HOST=${ISP_PROXY_HOST}
            ISP_PROXY_PORT=${ISP_PROXY_PORT}
            ISP_PROXY_USERNAME=${ISP_PROXY_USERNAME}
            ISP_PROXY_PASSWORD=${ISP_PROXY_PASSWORD}
            ENVEOF
            sed -i 's/^[[:space:]]*//' /root/pickleball-booker/.env

            # Log in to ghcr.io so the VPS can pull the private image
            echo $DEPLOY_TOKEN | docker login ghcr.io -u jason52388 --password-stdin

            # Pull new image and restart
            docker compose -f /root/pickleball-booker/docker-compose.yml pull
            docker compose -f /root/pickleball-booker/docker-compose.yml up -d --remove-orphans
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          CPD_URL: ${{ secrets.CPD_URL }}
          CPD_USERNAME: ${{ secrets.CPD_USERNAME }}
          CPD_PASSWORD: ${{ secrets.CPD_PASSWORD }}
          BOOKING_EVENT_NAME: ${{ secrets.BOOKING_EVENT_NAME }}
          BOOKING_LOCK_ENABLED: ${{ secrets.BOOKING_LOCK_ENABLED }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          PREVIEW_STOP_BEFORE_PAY: ${{ secrets.PREVIEW_STOP_BEFORE_PAY }}
          TARGET_FACILITY: ${{ secrets.TARGET_FACILITY }}
          PICKLEBALL_INCLUDE: ${{ secrets.PICKLEBALL_INCLUDE }}
          PICKLEBALL_EXCLUDE: ${{ secrets.PICKLEBALL_EXCLUDE }}
          PREFERRED_START_HOUR: ${{ secrets.PREFERRED_START_HOUR }}
          PREFERRED_END_HOUR: ${{ secrets.PREFERRED_END_HOUR }}
          CREDIT_CARD_CVV: ${{ secrets.CREDIT_CARD_CVV }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CALENDAR_INVITE_EMAILS: ${{ secrets.CALENDAR_INVITE_EMAILS }}
          BROWSER_HEADLESS: ${{ secrets.BROWSER_HEADLESS }}
          ISP_PROXY_HOST: ${{ secrets.ISP_PROXY_HOST }}
          ISP_PROXY_PORT: ${{ secrets.ISP_PROXY_PORT }}
          ISP_PROXY_USERNAME: ${{ secrets.ISP_PROXY_USERNAME }}
          ISP_PROXY_PASSWORD: ${{ secrets.ISP_PROXY_PASSWORD }}
