name: Build, push, and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Build, push image, and deploy to VPS
        type: boolean
        default: true
      run_checker:
        description: Run daily_runner once in the VPS container (after deploy, or alone if deploy is off)
        type: boolean
        default: true

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.deploy == true || inputs.deploy == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Write .env and deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_TOKEN,CPD_URL,CPD_USERNAME,CPD_PASSWORD,BOOKING_EVENT_NAME,BOOKING_LOCK_ENABLED,DRY_RUN,DRY_RUN_POLL_MINUTES,PREVIEW_STOP_BEFORE_PAY,TARGET_FACILITY,PICKLEBALL_INCLUDE,PICKLEBALL_EXCLUDE,PREFERRED_START_HOUR,PREFERRED_END_HOUR,CREDIT_CARD_CVV,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,SMTP_USER,SMTP_PASSWORD,CALENDAR_INVITE_EMAILS,BROWSER_HEADLESS,ISP_PROXY_HOST,ISP_PROXY_PORT,ISP_PROXY_USERNAME,ISP_PROXY_PASSWORD,RUN_CHECKER
          script: |
            # Clone or update repo
            if [ ! -d /root/pickleball-booker/.git ]; then
              rm -rf /root/pickleball-booker
              git clone https://gh-token:$DEPLOY_TOKEN@github.com/jason52388/pickleball-booker.git /root/pickleball-booker
            else
              git -C /root/pickleball-booker remote set-url origin https://gh-token:$DEPLOY_TOKEN@github.com/jason52388/pickleball-booker.git
              git -C /root/pickleball-booker pull origin main
            fi

            # Ensure data directory exists for volume mount
            mkdir -p /root/pickleball-booker/data

            # Write .env from secrets/variables
            {
              echo "CPD_URL=${CPD_URL}"
              echo "CPD_USERNAME=${CPD_USERNAME}"
              echo "CPD_PASSWORD=${CPD_PASSWORD}"
              echo "BOOKING_EVENT_NAME=${BOOKING_EVENT_NAME}"
              echo "BOOKING_LOCK_ENABLED=${BOOKING_LOCK_ENABLED}"
              echo "DRY_RUN=${DRY_RUN}"
              echo "DRY_RUN_POLL_MINUTES=${DRY_RUN_POLL_MINUTES}"
              echo "PREVIEW_STOP_BEFORE_PAY=${PREVIEW_STOP_BEFORE_PAY}"
              echo "TARGET_FACILITY=${TARGET_FACILITY}"
              echo "PICKLEBALL_INCLUDE=${PICKLEBALL_INCLUDE}"
              echo "PICKLEBALL_EXCLUDE=${PICKLEBALL_EXCLUDE}"
              echo "PREFERRED_START_HOUR=${PREFERRED_START_HOUR}"
              echo "PREFERRED_END_HOUR=${PREFERRED_END_HOUR}"
              echo "CREDIT_CARD_CVV=${CREDIT_CARD_CVV}"
              echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
              echo "TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}"
              echo "SMTP_USER=${SMTP_USER}"
              echo "SMTP_PASSWORD=${SMTP_PASSWORD}"
              echo "CALENDAR_INVITE_EMAILS=${CALENDAR_INVITE_EMAILS}"
              echo "BROWSER_HEADLESS=${BROWSER_HEADLESS}"
              echo "ISP_PROXY_HOST=${ISP_PROXY_HOST}"
              echo "ISP_PROXY_PORT=${ISP_PROXY_PORT}"
              echo "ISP_PROXY_USERNAME=${ISP_PROXY_USERNAME}"
              echo "ISP_PROXY_PASSWORD=${ISP_PROXY_PASSWORD}"
            } > /root/pickleball-booker/.env

            # Log in to ghcr.io so the VPS can pull the private image
            echo $DEPLOY_TOKEN | docker login ghcr.io -u jason52388 --password-stdin

            # Pull new image and restart
            docker compose -f /root/pickleball-booker/docker-compose.yml pull
            docker compose -f /root/pickleball-booker/docker-compose.yml up -d --remove-orphans

            if [ "$RUN_CHECKER" = "true" ]; then
              echo "Running one-off daily_runner in container..."
              docker compose -f /root/pickleball-booker/docker-compose.yml exec -T pickleball python3 /app/daily_runner.py
            fi
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          CPD_URL: ${{ vars.CPD_URL || secrets.CPD_URL }}
          CPD_USERNAME: ${{ vars.CPD_USERNAME || secrets.CPD_USERNAME }}
          CPD_PASSWORD: ${{ secrets.CPD_PASSWORD }}
          BOOKING_EVENT_NAME: ${{ vars.BOOKING_EVENT_NAME || secrets.BOOKING_EVENT_NAME }}
          BOOKING_LOCK_ENABLED: ${{ vars.BOOKING_LOCK_ENABLED || secrets.BOOKING_LOCK_ENABLED }}
          DRY_RUN: ${{ vars.DRY_RUN || secrets.DRY_RUN }}
          DRY_RUN_POLL_MINUTES: ${{ vars.DRY_RUN_POLL_MINUTES || secrets.DRY_RUN_POLL_MINUTES || '30' }}
          PREVIEW_STOP_BEFORE_PAY: ${{ vars.PREVIEW_STOP_BEFORE_PAY || secrets.PREVIEW_STOP_BEFORE_PAY }}
          TARGET_FACILITY: ${{ vars.TARGET_FACILITY || secrets.TARGET_FACILITY }}
          PICKLEBALL_INCLUDE: ${{ vars.PICKLEBALL_INCLUDE || secrets.PICKLEBALL_INCLUDE }}
          PICKLEBALL_EXCLUDE: ${{ vars.PICKLEBALL_EXCLUDE || secrets.PICKLEBALL_EXCLUDE }}
          PREFERRED_START_HOUR: ${{ vars.PREFERRED_START_HOUR || secrets.PREFERRED_START_HOUR }}
          PREFERRED_END_HOUR: ${{ vars.PREFERRED_END_HOUR || secrets.PREFERRED_END_HOUR }}
          CREDIT_CARD_CVV: ${{ secrets.CREDIT_CARD_CVV }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ vars.SMTP_USER || secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CALENDAR_INVITE_EMAILS: ${{ vars.CALENDAR_INVITE_EMAILS || secrets.CALENDAR_INVITE_EMAILS }}
          BROWSER_HEADLESS: ${{ vars.BROWSER_HEADLESS || secrets.BROWSER_HEADLESS }}
          ISP_PROXY_HOST: ${{ vars.ISP_PROXY_HOST || secrets.ISP_PROXY_HOST }}
          ISP_PROXY_PORT: ${{ vars.ISP_PROXY_PORT || secrets.ISP_PROXY_PORT }}
          ISP_PROXY_USERNAME: ${{ vars.ISP_PROXY_USERNAME || secrets.ISP_PROXY_USERNAME }}
          ISP_PROXY_PASSWORD: ${{ secrets.ISP_PROXY_PASSWORD }}
          RUN_CHECKER: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_checker == true || inputs.run_checker == 'true') && (inputs.deploy == true || inputs.deploy == 'true') && 'true' || 'false' }}

  vps-run-checker:
    if: github.event_name == 'workflow_dispatch' && (inputs.run_checker == true || inputs.run_checker == 'true') && (inputs.deploy == false || inputs.deploy == 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Run daily_runner on VPS (no deploy)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker compose -f /root/pickleball-booker/docker-compose.yml exec -T pickleball python3 /app/daily_runner.py
